remote_theme: simplonco/simplonline-ressources-jekyll-theme

title: "01 - Introduction aux bases de données relationnelles"
description: "Comprendre les bases de données relationnelles et écrire tes premières requêtes SQL"
github_org: simplonco
lang: fr

show_toc: true

readme_index:
  with_frontmatter: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-readme-index
  - jekyll-remote-theme
  - jekyll-stepper